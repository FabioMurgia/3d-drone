<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone gallery</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <main class="master-container">
      <!--Main Menu Bar-->
      <div class="filter-container">
        <button
          class="filter-btn"
          data-filter="airframe"
          onclick="highlightAirframe('Frame')"
        >
          Airframe
        </button>
        <button
          class="filter-btn"
          data-filter="propulsion"
          onclick="highlightPropulsion('propulsion')"
        >
          Propulsion
        </button>
        <button
          class="filter-btn"
          data-filter="navigation"
          onclick="highlightNavigation('Navigation')"
        >
          Navigation
        </button>
        <button
          class="filter-btn"
          data-filter="communication"
          onclick="highlightCommunication('Communication')"
        >
          Communication
        </button>
        <button
          class="filter-btn"
          data-filter="munitions"
          onclick="highlightMunitions('Munitions')"
        >
          Munitions
        </button>
      </div>

      <div class="panel-container">
        <!--3D MODEL-->
        <div class="drone-container">
          <iframe
            title="Shahed drone"
            id="drone-model"
            frameborder="0"
            allowfullscreen
            mozallowfullscreen="true"
            webkitallowfullscreen="true"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            xr-spatial-tracking
            execution-while-out-of-viewport
            execution-while-not-rendered
            web-share
            width="100%"
            height="680"
            src="https://sketchfab.com/models/10382bef344c4a88abb4d1723b339fd4/embed?autospin=0&autostart=1&preload=1&transparent=1&ui_infos=0&ui_stop=0&ui_inspector=0&ui_watermark_link=0&ui_watermark=0&ui_ar=0&ui_help=0&ui_settings=0&ui_vr=0&ui_fullscreen=0"
          >
          </iframe>
        </div>
        <!--TIMELINE-->
        <div class="timeline-container">
          <div class="gallery-container">
            <!--LANDING-->
            <div class="landing">
              <img
                src="assets/arrow-up.png"
                style="
                  opacity: 40%;
                  max-width: 22px;
                  margin-top: 0px;
                  margin-bottom: 20px;
                "
              /><br />Select a component from the menu to explore a timeline of
              its evolution
            </div>

            <!-- Sub-Filter Controls -->
            <div class="navigation-filter" style="display: none">
              <button class="navigation-btn active" data-subfilter="nav-1">
                Flight Control
              </button>
              <button class="navigation-btn" data-subfilter="nav-2">
                Satellite Navigation
              </button>
            </div>

            <div class="munitions-filter" style="display: none">
              <button class="munitions-btn active" data-subfilter="mun-1">
                Warhead
              </button>
              <button class="munitions-btn" data-subfilter="mun-2">
                Anti-Air Armament
              </button>
              <button class="munitions-btn" data-subfilter="mun-3">
                Auxiliary Munitions
              </button>
            </div>

            <!-- Dynamic DOM Rows Injected Here -->
            <div id="dynamic-gallery-rows"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
